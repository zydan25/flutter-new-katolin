name: flutter_payment_network
description: "A Flutter module for telecom payments and inquiries embedded in Kotlin Android app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  module:
    androidX: true
    androidPackage: com.example.flutter_payment_network
    iosBundleIdentifier: com.example.flutterPaymentNetwork
