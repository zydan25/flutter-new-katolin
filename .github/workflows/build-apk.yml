name: Build SHOPIK Flutter APK

on:
  push:
    branches:
      - main
      - master
      - 'flutter/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter:
    name: Build standalone SHOPIK Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopik_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host if missing
        run: flutter create --platforms=android .

      - name: Ensure Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              text = text.replace('<manifest ', '<manifest ' + permission, 1)
              p.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutter-release-apk
          path: shopik_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutter-release-aab
          path: shopik_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
