name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native:
    name: Build Native Android (Kotlin & Flutter) APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Get Flutter Dependencies
        run: |
          cd flutter-katolin/flutter_payment_network
          flutter pub get

      - name: Build Native Kotlin & Flutter APK
        run: |
          cd flutter-katolin
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test
        continue-on-error: true

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopik-native-android-flutter-debug
          path: flutter-katolin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  build-capacitor:
    name: Build Hybrid Web (Capacitor) APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopik-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
