name: Build SHOPIK Flutter APK

on:
  push:
    branches:
      - main
      - master
      - 'flutter/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter:
    name: Build extracted SHOPIK Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutterapp/shopik_app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify extracted Flutter project
        run: test -f pubspec.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host if missing
        run: flutter create --platforms=android --no-pub .

      - name: Enable FragmentActivity for local_auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app/src/main')
          for p in root.rglob('MainActivity.kt'):
              s = p.read_text()
              s = s.replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterFragmentActivity')
              s = s.replace('class MainActivity: FlutterActivity()', 'class MainActivity: FlutterFragmentActivity()')
              s = s.replace('class MainActivity : FlutterActivity()', 'class MainActivity : FlutterFragmentActivity()')
              p.write_text(s)
          for p in root.rglob('MainActivity.java'):
              s = p.read_text()
              s = s.replace('import io.flutter.embedding.android.FlutterActivity;', 'import io.flutter.embedding.android.FlutterFragmentActivity;')
              s = s.replace('extends FlutterActivity', 'extends FlutterFragmentActivity')
              p.write_text(s)
          PY

      - name: Ensure Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              manifest_start = text.find('<manifest')
              if manifest_start == -1:
                  raise SystemExit('AndroidManifest.xml does not contain a <manifest> element')
              manifest_end = text.find('>', manifest_start)
              if manifest_end == -1:
                  raise SystemExit('AndroidManifest.xml has an invalid <manifest> opening tag')
              text = text[:manifest_end + 1] + '\n    ' + permission + text[manifest_end + 1:]
              p.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutter-release-apk
          path: flutterapp/shopik_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutter-release-aab
          path: flutterapp/shopik_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14