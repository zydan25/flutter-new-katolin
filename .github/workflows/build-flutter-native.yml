# Native Flutter build for the project extracted under flutterapp/shopik_app.
name: Build SHOPIK Native Flutter

on:
  push:
    branches:
      - 'flutter/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutterapp/shopik_app
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Verify extracted Flutter project
        run: test -f pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Add Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET" />'
          if perm not in text:
              text = text.replace('<manifest ', '<manifest ' + perm, 1)
          p.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutter-native-release-apk
          path: flutterapp/shopik_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutter-native-release-aab
          path: flutterapp/shopik_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error