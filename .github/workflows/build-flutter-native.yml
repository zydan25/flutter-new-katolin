# Native Flutter build for the project extracted under flutterapp.
name: Build SHOPIK Native Flutter

on:
  push:
    branches:
      - 'flutter/**'
    paths:
      - 'flutterapp/**'
      - '.github/workflows/build-flutter-native.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutterapp
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify extracted Flutter project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f pubspec.yaml ]; then
            echo "pubspec.yaml was not found in flutterapp."
            echo "Contents of flutterapp:"
            find . -maxdepth 3 -type f | sort | head -300
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Add Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET" />'
          if perm not in text:
              text = text.replace('<manifest ', '<manifest ' + perm, 1)
          p.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutterapp-release-apk
          path: flutterapp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutterapp-release-aab
          path: flutterapp/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
