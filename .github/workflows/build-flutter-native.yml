# Native Flutter build for the new standalone SHOPIK app under shopik_flutter.
name: Build SHOPIK Native Flutter

on:
  push:
    branches:
      - 'flutter/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopik_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project if missing
        run: flutter create --platforms=android .
      - name: Add Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET" />'
          if perm not in text:
              text = text.replace('<manifest ', '<manifest ' + perm, 1)
          p.write_text(text)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release AAB
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutter-release-apk
          path: shopik_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shopik-flutter-release-aab
          path: shopik_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
